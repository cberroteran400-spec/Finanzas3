name: Finanzas3 APK
on:
  push:
    branches: [principal]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compilar APK
        run: |
          rm -f capacitor.config.json paquete.json package.json package-lock.json
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          mkdir -p www
          cp indice.html www/index.html
          npx cap init Finanzas3 com.finanzas3.app --web-dir=www --npm-client npm
          npx cap add android
          npx cap copy android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Finanzas3-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
