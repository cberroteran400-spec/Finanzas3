<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Finanzas Fácil</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --bg: #f4f6f8;
    --card: #ffffff;
    --text: #17202a;
    --muted: #6b7280;
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --green: #16a34a;
    --red: #dc2626;
    --border: #e5e7eb;
    --input: #f9fafb;
    --shadow: 0 4px 18px rgba(0,0,0,.07);
}

body.dark {
    --bg: #111827;
    --card: #1f2937;
    --text: #f9fafb;
    --muted: #9ca3af;
    --border: #374151;
    --input: #111827;
    --shadow: 0 4px 18px rgba(0,0,0,.25);
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    transition: .2s;
}

button,
input,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

.app {
    width: 100%;
    max-width: 600px;
    margin: auto;
    min-height: 100vh;
    padding-bottom: 90px;
}

/* HEADER */

.header {
    background: var(--primary);
    color: white;
    padding: 22px 18px 28px;
    border-radius: 0 0 24px 24px;
}

.header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
}

.logo-icon {
    width: 42px;
    height: 42px;
    background: rgba(255,255,255,.18);
    border-radius: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 23px;
}

.logo h1 {
    font-size: 20px;
}

.logo small {
    display: block;
    opacity: .8;
    margin-top: 3px;
}

.theme-btn {
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 50%;
    background: rgba(255,255,255,.18);
    color: white;
    font-size: 20px;
}

.balance-label {
    font-size: 14px;
    opacity: .8;
}

.balance {
    font-size: 35px;
    font-weight: bold;
    margin: 5px 0 18px;
}

.balance.negative {
    color: #fecaca;
}

.summary {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.summary-card {
    background: rgba(255,255,255,.14);
    padding: 13px;
    border-radius: 14px;
}

.summary-card span {
    display: block;
    font-size: 12px;
    opacity: .8;
}

.summary-card strong {
    display: block;
    font-size: 18px;
    margin-top: 5px;
}

/* CONTENT */

.content {
    padding: 18px;
}

.section-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.section-title h2 {
    font-size: 19px;
}

.clear-btn {
    background: transparent;
    border: none;
    color: var(--primary);
    font-size: 13px;
}

/* ACTIONS */

.actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 24px;
}

.action-btn {
    border: none;
    border-radius: 16px;
    padding: 16px 10px;
    color: white;
    font-weight: bold;
    box-shadow: var(--shadow);
}

.action-income {
    background: var(--green);
}

.action-expense {
    background: var(--red);
}

/* FILTER */

.filters {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 18px;
}

.search {
    grid-column: 1 / -1;
}

input,
select {
    width: 100%;
    padding: 13px;
    border: 1px solid var(--border);
    background: var(--input);
    color: var(--text);
    border-radius: 12px;
    outline: none;
}

input:focus,
select:focus {
    border-color: var(--primary);
}

/* TRANSACTIONS */

.transactions {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.transaction {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 15px;
    padding: 13px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: var(--shadow);
}

.transaction-icon {
    width: 45px;
    height: 45px;
    border-radius: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
}

.transaction-icon.income {
    background: #dcfce7;
}

.transaction-icon.expense {
    background: #fee2e2;
}

.transaction-info {
    flex: 1;
    min-width: 0;
}

.transaction-name {
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.transaction-meta {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
}

.transaction-amount {
    text-align: right;
    font-weight: bold;
}

.transaction-amount.income {
    color: var(--green);
}

.transaction-amount.expense {
    color: var(--red);
}

.delete-btn {
    border: none;
    background: transparent;
    font-size: 18px;
    padding: 5px;
    opacity: .6;
}

.empty {
    background: var(--card);
    border: 1px dashed var(--border);
    border-radius: 16px;
    padding: 35px 20px;
    text-align: center;
    color: var(--muted);
}

.empty-icon {
    font-size: 38px;
    margin-bottom: 10px;
}

/* MODAL */

.modal {
    display: none;
    position: fixed;
    z-index: 100;
    inset: 0;
    background: rgba(0,0,0,.55);
    padding: 18px;
    align-items: flex-end;
    justify-content: center;
}

.modal.active {
    display: flex;
}

.modal-box {
    width: 100%;
    max-width: 600px;
    background: var(--card);
    color: var(--text);
    border-radius: 24px 24px 18px 18px;
    padding: 22px;
    max-height: 90vh;
    overflow-y: auto;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.close-btn {
    width: 35px;
    height: 35px;
    border: none;
    border-radius: 50%;
    background: var(--input);
    color: var(--text);
    font-size: 20px;
}

.form-group {
    margin-bottom: 14px;
}

.form-group label {
    display: block;
    margin-bottom: 7px;
    font-size: 13px;
    color: var(--muted);
}

.type-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.type-btn {
    padding: 13px;
    border-radius: 12px;
    border: 2px solid var(--border);
    background: var(--input);
    color: var(--text);
}

.type-btn.active.income {
    border-color: var(--green);
    background: #dcfce7;
    color: var(--green);
}

.type-btn.active.expense {
    border-color: var(--red);
    background: #fee2e2;
    color: var(--red);
}

.save-btn {
    width: 100%;
    border: none;
    border-radius: 14px;
    background: var(--primary);
    color: white;
    padding: 15px;
    font-weight: bold;
    margin-top: 5px;
}

.save-btn:active {
    background: var(--primary-dark);
}

/* BOTTOM NAV */

.bottom-nav {
    position: fixed;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    width: 100%;
    max-width: 600px;
    background: var(--card);
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-around;
    padding: 10px 5px calc(10px + env(safe-area-inset-bottom));
    z-index: 50;
}

.nav-btn {
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 11px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
}

.nav-btn span {
    font-size: 21px;
}

.nav-btn.active {
    color: var(--primary);
}

/* TOAST */

.toast {
    position: fixed;
    left: 50%;
    bottom: 82px;
    transform: translateX(-50%) translateY(20px);
    background: #111827;
    color: white;
    padding: 12px 18px;
    border-radius: 12px;
    opacity: 0;
    pointer-events: none;
    transition: .25s;
    z-index: 200;
    white-space: nowrap;
    font-size: 13px;
}

.toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

/* RESPONSIVE */

@media (min-width: 601px) {
    .header {
        border-radius: 0 0 28px 28px;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="header">
    <div class="header-top">
        <div class="logo">
            <div class="logo-icon">💰</div>
            <div>
                <h1>Finanzas Fácil</h1>
                <small>Controla tu dinero</small>
            </div>
        </div>

        <button class="theme-btn" id="themeBtn">🌙</button>
    </div>

    <div class="balance-label">Saldo disponible</div>
    <div class="balance" id="balance">$0.00</div>

    <div class="summary">
        <div class="summary-card">
            <span>Ingresos</span>
            <strong id="incomeTotal">$0.00</strong>
        </div>

        <div class="summary-card">
            <span>Gastos</span>
            <strong id="expenseTotal">$0.00</strong>
        </div>
    </div>
</header>

<main class="content">

    <div class="actions">
        <button class="action-btn action-income" onclick="openModal('income')">
            ➕ Ingreso
        </button>

        <button class="action-btn action-expense" onclick="openModal('expense')">
            ➖ Gasto
        </button>
    </div>

    <div class="section-title">
        <h2>Movimientos</h2>
        <button class="clear-btn" onclick="clearAll()">Borrar todo</button>
    </div>

    <div class="filters">
        <input
            class="search"
            id="search"
            type="search"
            placeholder="🔎 Buscar movimiento..."
        >

        <select id="filterType">
            <option value="all">Todos</option>
            <option value="income">Ingresos</option>
            <option value="expense">Gastos</option>
        </select>

        <select id="filterCategory">
            <option value="all">Todas las categorías</option>
            <option value="Comida">🍔 Comida</option>
            <option value="Transporte">🚗 Transporte</option>
            <option value="Casa">🏠 Casa</option>
            <option value="Salud">❤️ Salud</option>
            <option value="Entretenimiento">🎮 Entretenimiento</option>
            <option value="Compras">🛒 Compras</option>
            <option value="Educación">📚 Educación</option>
            <option value="Trabajo">💼 Trabajo</option>
            <option value="Otros">📦 Otros</option>
        </select>
    </div>

    <div class="transactions" id="transactions"></div>

</main>

<nav class="bottom-nav">
    <button class="nav-btn active">
        <span>🏠</span>
        Inicio
    </button>

    <button class="nav-btn" onclick="openModal('income')">
        <span>➕</span>
        Agregar
    </button>

    <button class="nav-btn" onclick="scrollToTransactions()">
        <span>📋</span>
        Historial
    </button>
</nav>

</div>

<!-- MODAL -->

<div class="modal" id="modal">

    <div class="modal-box">

        <div class="modal-header">
            <h2 id="modalTitle">Agregar movimiento</h2>

            <button class="close-btn" onclick="closeModal()">×</button>
        </div>

        <form id="transactionForm">

            <div class="form-group">
                <label>Tipo</label>

                <div class="type-buttons">

                    <button
                        type="button"
                        class="type-btn income"
                        id="incomeBtn"
                        onclick="selectType('income')">
                        ➕ Ingreso
                    </button>

                    <button
                        type="button"
                        class="type-btn expense"
                        id="expenseBtn"
                        onclick="selectType('expense')">
                        ➖ Gasto
                    </button>

                </div>
            </div>

            <div class="form-group">
                <label>Descripción</label>

                <input
                    id="description"
                    type="text"
                    placeholder="Ej. Sueldo, comida..."
                    required
                    maxlength="60">
            </div>

            <div class="form-group">
                <label>Cantidad</label>

                <input
                    id="amount"
                    type="number"
                    placeholder="0.00"
                    min="0.01"
                    step="0.01"
                    required>
            </div>

            <div class="form-group">
                <label>Categoría</label>

                <select id="category" required>
                    <option value="Comida">🍔 Comida</option>
                    <option value="Transporte">🚗 Transporte</option>
                    <option value="Casa">🏠 Casa</option>
                    <option value="Salud">❤️ Salud</option>
                    <option value="Entretenimiento">🎮 Entretenimiento</option>
                    <option value="Compras">🛒 Compras</option>
                    <option value="Educación">📚 Educación</option>
                    <option value="Trabajo">💼 Trabajo</option>
                    <option value="Otros">📦 Otros</option>
                </select>
            </div>

            <div class="form-group">
                <label>Fecha</label>

                <input id="date" type="date" required>
            </div>

            <button class="save-btn" type="submit">
                Guardar movimiento
            </button>

        </form>

    </div>

</div>

<div class="toast" id="toast"></div>

<script>

let transactions =
    JSON.parse(localStorage.getItem("finanzas_transactions")) || [];

let selectedType = "expense";

const $ = id => document.getElementById(id);

function money(value) {
    return new Intl.NumberFormat("es-MX", {
        style: "currency",
        currency: "MXN"
    }).format(value);
}

function saveData() {
    localStorage.setItem(
        "finanzas_transactions",
        JSON.stringify(transactions)
    );
}

function updateSummary() {

    let income = transactions
        .filter(t => t.type === "income")
        .reduce((sum, t) => sum + t.amount, 0);

    let expense = transactions
        .filter(t => t.type === "expense")
        .reduce((sum, t) => sum + t.amount, 0);

    let balance = income - expense;

    $("incomeTotal").textContent = money(income);
    $("expenseTotal").textContent = money(expense);

    $("balance").textContent = money(balance);

    $("balance").classList.toggle("negative", balance < 0);
}

function renderTransactions() {

    const container = $("transactions");

    const search =
        $("search").value.toLowerCase().trim();

    const type =
        $("filterType").value;

    const category =
        $("filterCategory").value;

    let filtered = transactions.filter(t => {

        const matchesSearch =
            t.description.toLowerCase().includes(search) ||
            t.category.toLowerCase().includes(search);

        const matchesType =
            type === "all" || t.type === type;

        const matchesCategory =
            category === "all" || t.category === category;

        return matchesSearch &&
               matchesType &&
               matchesCategory;
    });

    filtered.sort((a,b) => b.created - a.created);

    if (filtered.length === 0) {

        container.innerHTML = `
            <div class="empty">
                <div class="empty-icon">📊</div>
                <strong>No hay movimientos</strong>
                <p style="margin-top:6px;">
                    Agrega tu primer ingreso o gasto.
                </p>
            </div>
        `;

        return;
    }

    container.innerHTML = filtered.map(t => {

        const sign =
            t.type === "income" ? "+" : "-";

        const icon =
            t.type === "income" ? "💵" : "💸";

        const date =
            new Date(t.date + "T00:00:00")
            .toLocaleDateString("es-MX");

        return `
            <div class="transaction">

                <div class="transaction-icon ${t.type}">
                    ${icon}
                </div>

                <div class="transaction-info">

                    <div class="transaction-name">
                        ${escapeHTML(t.description)}
                    </div>

                    <div class="transaction-meta">
                        ${escapeHTML(t.category)} · ${date}
                    </div>

                </div>

                <div class="transaction-amount ${t.type}">
                    ${sign}${money(t.amount)}
                </div>

                <button
                    class="delete-btn"
                    onclick="deleteTransaction('${t.id}')">
                    🗑️
                </button>

            </div>
        `;

    }).join("");
}

function escapeHTML(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}

function openModal(type = "expense") {

    selectedType = type;

    $("modal").classList.add("active");

    $("date").value =
        new Date().toISOString().split("T")[0];

    $("description").value = "";
    $("amount").value = "";

    selectType(type);
}

function closeModal() {

    $("modal").classList.remove("active");
}

function selectType(type) {

    selectedType = type;

    $("incomeBtn").classList.toggle(
        "active",
        type === "income"
    );

    $("expenseBtn").classList.toggle(
        "active",
        type === "expense"
    );
}

$("transactionForm").addEventListener(
    "submit",
    function(e) {

        e.preventDefault();

        const description =
            $("description").value.trim();

        const amount =
            parseFloat($("amount").value);

        const category =
            $("category").value;

        const date =
            $("date").value;

        if (!description) {
            showToast("Escribe una descripción");
            return;
        }

        if (!amount || amount <= 0) {
            showToast("Introduce una cantidad válida");
            return;
        }

        if (!date) {
            showToast("Selecciona una fecha");
            return;
        }

        const transaction = {

            id:
                Date.now().toString() +
                Math.random().toString(16).slice(2),

            type: selectedType,

            description,

            amount,

            category,

            date,

            created: Date.now()

        };

        transactions.push(transaction);

        saveData();

        updateSummary();

        renderTransactions();

        closeModal();

        showToast(
            selectedType === "income"
                ? "Ingreso guardado"
                : "Gasto guardado"
        );
    }
);

function deleteTransaction(id) {

    const transaction =
        transactions.find(t => t.id === id);

    if (!transaction) return;

    const confirmDelete =
        confirm(
            `¿Eliminar "${transaction.description}"?`
        );

    if (!confirmDelete) return;

    transactions =
        transactions.filter(t => t.id !== id);

    saveData();

    updateSummary();

    renderTransactions();

    showToast("Movimiento eliminado");
}

function clearAll() {

    if (transactions.length === 0) {

        showToast("No hay movimientos");

        return;
    }

    const confirmDelete =
        confirm(
            "¿Seguro que quieres borrar todos los movimientos?"
        );

    if (!confirmDelete) return;

    transactions = [];

    saveData();

    updateSummary();

    renderTransactions();

    showToast("Todos los movimientos fueron eliminados");
}

function showToast(message) {

    const toast = $("toast");

    toast.textContent = message;

    toast.classList.add("show");

    setTimeout(() => {

        toast.classList.remove("show");

    }, 2200);
}

function scrollToTransactions() {

    document.querySelector(".section-title")
        .scrollIntoView({
            behavior: "smooth"
        });
}

$("search").addEventListener(
    "input",
    renderTransactions
);

$("filterType").addEventListener(
    "change",
    renderTransactions
);

$("filterCategory").addEventListener(
    "change",
    renderTransactions
);

$("themeBtn").addEventListener(
    "click",
    function() {

        document.body.classList.toggle("dark");

        const dark =
            document.body.classList.contains("dark");

        localStorage.setItem(
            "finanzas_dark",
            dark ? "1" : "0"
        );

        $("themeBtn").textContent =
            dark ? "☀️" : "🌙";
    }
);

if (
    localStorage.getItem("finanzas_dark") === "1"
) {

    document.body.classList.add("dark");

    $("themeBtn").textContent = "☀️";
}

$("modal").addEventListener(
    "click",
    function(e) {

        if (e.target === $("modal")) {

            closeModal();

        }

    }
);

updateSummary();

renderTransactions();

</script>

</body>
</html>
